<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="700" viewBox="0 0 1100 700">
  <style>
    .box { fill: #f8fafc; stroke: #1e293b; stroke-width: 2; }
    .title { fill: #dbeafe; stroke: #1e293b; stroke-width: 2; }
    .factory { fill: #dcfce7; stroke: #1e293b; stroke-width: 2; }
    text { font-family: Arial, sans-serif; fill: #0f172a; font-size: 16px; }
    .heading { font-weight: bold; font-size: 18px; }
    .line { stroke: #334155; stroke-width: 2; fill: none; }
    .dashed { stroke-dasharray: 8 6; }
  </style>
  <text x="550" y="35" text-anchor="middle" class="heading">Bridge + Factory — contexto de sindicato</text>

  <rect x="55" y="90" width="300" height="150" class="title"/>
  <text x="205" y="120" text-anchor="middle" class="heading">«abstract» AvisoSindicato</text>
  <line x1="55" y1="132" x2="355" y2="132" class="line"/>
  <text x="75" y="160">- canal: CanalComunicacao</text>
  <text x="75" y="190">+ montarMensagem(): String</text>
  <text x="75" y="218">+ enviarPara(contato): String</text>

  <rect x="55" y="330" width="300" height="120" class="box"/>
  <text x="205" y="360" text-anchor="middle" class="heading">AvisoAssembleia</text>
  <line x1="55" y1="372" x2="355" y2="372" class="line"/>
  <text x="75" y="402">- data: String</text>
  <text x="75" y="428">- local: String</text>

  <rect x="55" y="510" width="300" height="120" class="box"/>
  <text x="205" y="540" text-anchor="middle" class="heading">AvisoNegociacaoSalarial</text>
  <line x1="55" y1="552" x2="355" y2="552" class="line"/>
  <text x="75" y="582">- reajuste: String</text>

  <rect x="470" y="90" width="300" height="145" class="title"/>
  <text x="620" y="120" text-anchor="middle" class="heading">«interface» CanalComunicacao</text>
  <line x1="470" y1="132" x2="770" y2="132" class="line"/>
  <text x="490" y="170">+ enviar(destinatario,</text>
  <text x="505" y="195">mensagem): String</text>

  <rect x="470" y="330" width="300" height="100" class="box"/>
  <text x="620" y="365" text-anchor="middle" class="heading">EmailCanal</text>
  <line x1="470" y1="378" x2="770" y2="378" class="line"/>
  <text x="490" y="408">+ enviar(...): String</text>

  <rect x="470" y="480" width="300" height="100" class="box"/>
  <text x="620" y="515" text-anchor="middle" class="heading">SmsCanal</text>
  <line x1="470" y1="528" x2="770" y2="528" class="line"/>
  <text x="490" y="558">+ enviar(...): String</text>

  <rect x="850" y="170" width="210" height="170" class="factory"/>
  <text x="955" y="205" text-anchor="middle" class="heading">CanalComunicacaoFactory</text>
  <line x1="850" y1="220" x2="1060" y2="220" class="line"/>
  <text x="870" y="255">+ criar(tipo):</text>
  <text x="885" y="280">CanalComunicacao</text>
  <text x="870" y="315">TipoCanal</text>

  <path d="M205 240 L205 330" class="line"/>
  <path d="M185 330 L205 300 L225 330" class="line"/>
  <path d="M205 450 L205 510" class="line"/>
  <path d="M185 510 L205 480 L225 510" class="line"/>
  <path d="M355 165 L470 165" class="line dashed"/>
  <polygon points="470,165 455,157 455,173" fill="#334155"/>
  <path d="M620 235 L620 330" class="line"/>
  <path d="M600 330 L620 300 L640 330" class="line"/>
  <path d="M620 430 L620 480" class="line"/>
  <path d="M600 480 L620 450 L640 480" class="line"/>
  <path d="M850 270 L770 270 L770 165" class="line dashed"/>
</svg>
